name: CI

# Runs on GitHub's own runners with an emulated Cloudflare stack, so it needs no
# Cloudflare account, no API token and no repository secrets. A fork gets a
# working pipeline with nothing to configure.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (dry run, no deploy)
        run: npx wrangler deploy --dry-run --config tests/wrangler.test.jsonc --outdir=/tmp/gaspool-build

      - name: Smoke test
        run: npm test
